name: Redraw profile cards

on:
  schedule:
    - cron: '30 18 * * *' # 00:00 IST every night
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**']

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate SVG cards
        run: node scripts/generate.mjs
        env:
          # Optional: add a PAT named PROFILE_TOKEN (scope: read:user) to also count private contributions
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: redraw profile cards"
            git push
          fi
